<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hosting Free - Mobile Optimized</title>
    <style>
        * {
            box-sizing: border-box;
            max-width: 100%;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        h2, h3 {
            text-align: center;
            color: #212529;
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 600;
        }

        h2 { font-size: 16px; border-bottom: 2px solid #dee2e6; padding-bottom: 6px; }
        h3 { font-size: 13px; text-align: left; }

        .section {
            background: #ffffff;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #dee2e6;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 2px;
            color: #6c757d;
        }

        input, select, textarea {
            width: 100%;
            padding: 7px 8px;
            margin-top: 2px;
            margin-bottom: 8px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 12px;
            background-color: #fff;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #0d6efd;
        }

        textarea { height: 80px; resize: vertical; font-family: monospace; }

        button {
            color: white;
            border: none;
            padding: 8px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 2px;
            font-weight: 600;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            background-color: #e9ecef !important;
            color: #adb5bd !important;
            cursor: not-allowed;
        }

        .btn-primary { background-color: #198754; }
        .btn-primary:hover:not(:disabled) { background-color: #157347; }

        .btn-secondary { background-color: #0d6efd; }
        .btn-secondary:hover:not(:disabled) { background-color: #0b5ed7; }

        .btn-warning { background-color: #fd7e14; color: #fff; }
        .btn-warning:hover:not(:disabled) { background-color: #e86902; }

        .btn-dark { background-color: #212529; color: #fff; }
        .btn-dark:hover:not(:disabled) { background-color: #000; }

        .btn-success { background-color: #198754; color: #fff; }
        .btn-success:hover:not(:disabled) { background-color: #157347; }

        .btn-info { background-color: #0dcaf0; color: #000; }
        .btn-info:hover:not(:disabled) { background-color: #0bb5d6; }

        .btn-purple { background-color: #6f42c1; color: #fff; }
        .btn-purple:hover:not(:disabled) { background-color: #5a32a3; }

        #status {
            text-align: center;
            margin-bottom: 8px;
            font-weight: 600;
            color: #dc3545;
            font-size: 11px;
            min-height: 20px;
            padding: 5px;
            background: #fdf2f2;
            border-radius: 4px;
            border: 1px solid #f5c6cb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success {
            color: #198754 !important;
            background: #f1f8f5 !important;
            border-color: #c3e6cb !important;
        }

        .file-item {
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 6px;
            margin-top: 6px;
            border: 1px solid #dee2e6;
            font-size: 12px;
            gap: 6px;
        }

        .file-info {
            display: flex;
            flex-direction: column;
            width: 100%;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 4px;
            width: 100%;
            flex-wrap: wrap;
        }

        .link-btn {
            background-color: #0dcaf0;
            color: #000;
            padding: 5px 6px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            flex: 1;
            display: inline-block;
        }

        .copy-btn {
            background-color: #6c757d;
            color: white;
            padding: 5px 6px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            flex: 1;
            margin-top: 0;
        }

        .edit-btn {
            background-color: #ffc107;
            color: #000;
            padding: 5px 6px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            flex: 1;
            margin-top: 0;
            font-weight: 600;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #cfe2ff;
            border-top-color: #0d6efd;
            border-right-color: #6610f2;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 5px;
            vertical-align: middle;
        }

        #buildStatusBox {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 8px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 11px;
            display: none;
        }

        #liveLinkBox {
            background: #f8f9fa;
            border: 1px solid #198754;
            padding: 8px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 11px;
            display: none;
        }

        .link-box {
            background: #e7f3ff;
            border: 1px solid #0d6efd;
            padding: 8px;
            border-radius: 6px;
            margin-top: 6px;
            font-size: 11px;
        }

        .link-box input {
            background: white;
            font-size: 10px;
            padding: 5px;
            margin-bottom: 4px;
            border: 1px solid #ced4da;
        }

        .link-box .btn-group {
            margin-top: 4px;
        }

        .link-box .copy-btn {
            background: #0d6efd;
            color: white;
            padding: 4px 8px;
            font-size: 10px;
        }

        .link-box .copy-btn:hover {
            background: #0b5ed7;
        }

        .dual-link-box {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: 2px solid #6f42c1;
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
            display: none;
        }

        .dual-link-box .link-item {
            background: white;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            border-left: 3px solid;
        }

        .dual-link-box .link-item.git-link {
            border-left-color: #0d6efd;
        }

        .dual-link-box .link-item.live-link {
            border-left-color: #198754;
        }

        .dual-link-box .link-item label {
            font-size: 10px;
            margin-bottom: 2px;
            color: #6c757d;
        }

        .dual-link-box .link-item input {
            font-size: 10px;
            padding: 4px 6px;
            margin-bottom: 4px;
            border: 1px solid #dee2e6;
            background: #f8f9fa;
        }

        .dual-link-box .copy-btn-sm {
            background: #6f42c1;
            color: white;
            padding: 3px 8px;
            border: none;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
        }

        .dual-link-box .copy-btn-sm:hover {
            background: #5a32a3;
        }

        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Hosting Free & APK Builder</h2>
    <div id="status">System is ready.</div>

    <div class="section">
        <h3>Create New Repository</h3>
        <label for="newRepoName">Repository Name</label>
        <input type="text" id="newRepoName" placeholder="e.g. Hosting-Website">
        <button id="btnCreateRepo" class="btn-secondary" onclick="createRepository()">Create Repository</button>
        <div id="createdRepoBox" style="margin-top: 8px; display: none;">
            <div class="link-box">
                <label>🔗 Git Clone URL</label>
                <input type="text" id="outputGitUrl" readonly style="background: #e9ecef; font-size: 11px; color: #333;">
                <button class="copy-btn" onclick="copyCreatedGitUrl()">📋 Copy Git Clone Link</button>
            </div>
            <div class="link-box" style="border-color: #198754; background: #f0f9f0;">
                <label>🌐 Live Page URL</label>
                <input type="text" id="outputLiveUrl" readonly style="background: #e9ecef; font-size: 11px; color: #333;">
                <button class="copy-btn" onclick="copyLiveUrl()" style="background: #198754;">📋 Copy Live Page Link</button>
            </div>
        </div>
    </div>

    <div class="section">
        <h3 id="formTitle">Upload or Save File</h3>
        <label for="targetRepo">Repository Name</label>
        <input type="text" id="targetRepo" placeholder="e.g. Hosting-Website">
        
        <label for="fileName">File Path / Name</label>
        <input type="text" id="fileName" placeholder="e.g. index.html">
        
        <label for="fileContent">File Source Code</label>
        <textarea id="fileContent" placeholder="Write your code here..."></textarea>
        
        <button id="btnUpload" class="btn-primary" onclick="uploadFileToRepo()">Save File to GitHub</button>
    </div>

    <div class="section">
        <h3>GitHub Actions & APK Status</h3>
        <label for="fetchRepo">Repository Name</label>
        <input type="text" id="fetchRepo" placeholder="Enter repository name" onchange="fetchRepoFiles()">
        
        <button id="btnCheckBuild" class="btn-dark" onclick="checkGitHubActionsBuilds()">Check APK Build Status</button>
        <button id="btnEnablePages" class="btn-warning" onclick="enableGitHubPages()" style="margin-top: 4px;">Enable Live Pages Link</button>
        <button id="btnGetDualLinks" class="btn-purple" onclick="getDualLinks()" style="margin-top: 4px;">🔗 Get Live & Clone Link</button>
        <button id="btnFetchFiles" class="btn-secondary" onclick="fetchRepoFiles()" style="margin-top: 4px;">Refresh Files</button>
        
        <!-- Dual Links Display Box -->
        <div id="dualLinkBox" class="dual-link-box">
            <div class="link-item git-link">
                <label>🔗 Git Clone URL</label>
                <input type="text" id="dualGitUrl" readonly>
                <button class="copy-btn-sm" onclick="copyDualGitUrl()">📋 Copy</button>
            </div>
            <div class="link-item live-link">
                <label>🌐 Live Page URL</label>
                <input type="text" id="dualLiveUrl" readonly>
                <button class="copy-btn-sm" onclick="copyDualLiveUrl()">📋 Copy</button>
            </div>
        </div>
        
        <div id="liveLinkBox"></div>
        <div id="buildStatusBox"></div>
        <div id="fileListContainer" style="margin-top: 8px; text-align: center; color: #6c757d; font-size: 11px;">No repository loaded yet.</div>
    </div>
</div>

<script>
    const USERNAME = "djpagla12121-web";
    const TOKEN = "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";

    function setStatus(msg, isSuccess = false, isLoading = false) {
        let statusEl = document.getElementById("status");
        if (isLoading) {
            statusEl.innerHTML = `<span class="spinner"></span> <span>${msg}</span>`;
            statusEl.className = "";
        } else {
            statusEl.innerText = msg;
            statusEl.className = isSuccess ? "success" : "";
        }
    }

    function toggleButtons(disable) {
        document.querySelectorAll("button").forEach(btn => {
            if(!btn.classList.contains('copy-btn') && !btn.classList.contains('copy-btn-sm')) btn.disabled = disable;
        });
    }

    function copyToClipboard(text, btnElement) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showCopySuccess(btnElement);
            }).catch(() => {
                fallbackCopy(text, btnElement);
            });
        } else {
            fallbackCopy(text, btnElement);
        }
    }

    function fallbackCopy(text, btnElement) {
        let textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            let successful = document.execCommand('copy');
            if (successful) {
                showCopySuccess(btnElement);
            } else {
                alert("Failed to copy!");
            }
        } catch (err) {
            alert("Browser not supported!");
        }
        document.body.removeChild(textArea);
    }

    function showCopySuccess(btn) {
        let originalText = btn.innerText;
        btn.innerText = "Copied ✓";
        setTimeout(() => { btn.innerText = originalText; }, 2000);
    }

    async function createRepository() {
        let repoName = document.getElementById("newRepoName").value.trim();
        if (!repoName) { alert("Please enter a repository name!"); return; }
        
        toggleButtons(true);
        setStatus("Creating repository...", false, true);

        try {
            let response = await fetch("https://api.github.com/user/repos", {
                method: "POST",
                headers: { "Authorization": `token ${TOKEN}`, "Content-Type": "application/json", "Accept": "application/vnd.github.v3+json" },
                body: JSON.stringify({ name: repoName, private: false, auto_init: true })
            });
            let result = await response.json();
            if (response.ok) {
                let gitUrl = `https://github.com/${USERNAME}/${repoName}.git`;
                let liveUrl = `https://${USERNAME}.github.io/${repoName}/`;
                
                setStatus(`Repository "${repoName}" created successfully!`, true, false);
                
                document.getElementById("outputGitUrl").value = gitUrl;
                document.getElementById("outputLiveUrl").value = liveUrl;
                document.getElementById("createdRepoBox").style.display = "block";

                document.getElementById("newRepoName").value = "";
                document.getElementById("targetRepo").value = repoName;
                document.getElementById("fetchRepo").value = repoName;
                fetchRepoFiles();
            } else {
                setStatus("Failed: " + (result.message || "Repository might already exist."), false, false);
            }
        } catch (error) { 
            console.error(error); 
            setStatus("Network error occurred!", false, false); 
        } finally {
            toggleButtons(false);
        }
    }

    function copyCreatedGitUrl() {
        let gitInput = document.getElementById("outputGitUrl");
        let btn = event.target;
        copyToClipboard(gitInput.value, btn);
    }

    function copyLiveUrl() {
        let liveInput = document.getElementById("outputLiveUrl");
        let btn = event.target;
        copyToClipboard(liveInput.value, btn);
    }

    async function uploadFileToRepo() {
        let repo = document.getElementById("targetRepo").value.trim();
        let path = document.getElementById("fileName").value.trim();
        let content = document.getElementById("fileContent").value;
        if (!repo || !path || !content) { alert("Please fill in all fields!"); return; }
        
        toggleButtons(true);
        setStatus("Saving file...", false, true);

        let apiUrl = `https://api.github.com/repos/${USERNAME}/${repo}/contents/${path}`;
        let fileSha = "";
        try {
            let checkRes = await fetch(apiUrl, { headers: { "Authorization": `token ${TOKEN}` } });
            if (checkRes.ok) { let fileData = await checkRes.json(); fileSha = fileData.sha; }
        } catch (e) {}

        let encodedContent = btoa(unescape(encodeURIComponent(content)));
        let bodyData = { message: `Upload/Update ${path} via web manager`, content: encodedContent };
        if (fileSha) bodyData.sha = fileSha;

        try {
            let response = await fetch(apiUrl, {
                method: "PUT",
                headers: { "Authorization": `token ${TOKEN}`, "Content-Type": "application/json", "Accept": "application/vnd.github.v3+json" },
                body: JSON.stringify(bodyData)
            });
            let result = await response.json();
            if (response.ok) {
                setStatus(`File "${path}" saved successfully!`, true, false);
                document.getElementById("fileContent").value = "";
                document.getElementById("fileName").value = "";
                document.getElementById("fetchRepo").value = repo;
                fetchRepoFiles(); 
            } else { 
                setStatus("Save failed: " + result.message, false, false); 
            }
        } catch (error) { 
            console.error(error); 
            setStatus("Connection error occurred!", false, false); 
        } finally {
            toggleButtons(false);
        }
    }

    async function editFile(repo, path) {
        setStatus(`Loading "${path}"...`, false, true);
        let apiUrl = `https://api.github.com/repos/${USERNAME}/${repo}/contents/${path}`;
        
        try {
            let response = await fetch(apiUrl, { headers: { "Authorization": `token ${TOKEN}` } });
            if (response.ok) {
                let data = await response.json();
                let decodedContent = decodeURIComponent(escape(atob(data.content)));
                
                document.getElementById("targetRepo").value = repo;
                document.getElementById("fileName").value = path;
                document.getElementById("fileContent").value = decodedContent;
                
                window.scrollTo({ top: 120, behavior: 'smooth' });
                setStatus(`"${path}" is ready for editing.`, true, false);
            } else {
                setStatus("Failed to load file.", false, false);
            }
        } catch (error) {
            console.error(error);
            setStatus("An error occurred!", false, false);
        }
    }

    async function checkGitHubActionsBuilds() {
        let repo = document.getElementById("fetchRepo").value.trim();
        if (!repo) { alert("Please enter the repository name!"); return; }

        let box = document.getElementById("buildStatusBox");
        box.style.display = "block";
        box.innerHTML = "Checking build status from GitHub Actions...";
        setStatus("Checking build status...", false, true);

        try {
            let res = await fetch(`https://api.github.com/repos/${USERNAME}/${repo}/actions/runs`, {
                headers: { "Authorization": `token ${TOKEN}`, "Accept": "application/vnd.github.v3+json" }
            });
            let data = await res.json();
            if (res.ok && data.workflow_runs && data.workflow_runs.length > 0) {
                let latest = data.workflow_runs[0];
                let statusColor = latest.conclusion === "success" ? "green" : (latest.conclusion === "failure" ? "red" : "orange");
                let statusText = latest.status === "completed" ? latest.conclusion : latest.status;
                
                box.innerHTML = `
                    <b>Workflow:</b> ${latest.name}<br>
                    <b>Status:</b> <span style="color:${statusColor}; font-weight:bold;">${statusText.toUpperCase()}</span><br>
                    <b>Branch:</b> ${latest.head_branch}<br>
                    <a href="${latest.html_url}" target="_blank" style="color: #0d6efd; font-weight:bold;">Open in GitHub Actions ↗</a>
                `;
                setStatus("Build status checked!", true, false);
            } else {
                box.innerHTML = "No build history found for this repository yet.";
                setStatus("No builds found.", false, false);
            }
        } catch (e) {
            console.error(e);
            box.innerHTML = "Error fetching build status.";
            setStatus("Failed to check status.", false, false);
        }
    }

    async function enableGitHubPages() {
        let repo = document.getElementById("fetchRepo").value.trim();
        if (!repo) { alert("Please enter the repository name!"); return; }
        
        toggleButtons(true);
        setStatus("Processing live link...", false, true);

        try {
            let response = await fetch(`https://api.github.com/repos/${USERNAME}/${repo}/pages`, {
                method: "POST",
                headers: { 
                    "Authorization": `token ${TOKEN}`, 
                    "Content-Type": "application/json", 
                    "Accept": "application/vnd.github+json" 
                },
                body: JSON.stringify({
                    build_type: "legacy",
                    source: { branch: "main", path: "/" }
                })
            });
            
            if (response.ok || response.status === 201 || response.status === 422) {
                setStatus(`Success! Pages enabled.`, true, false);
                toggleButtons(false);
                fetchRepoFiles();
                getDualLinks();
            } else {
                let res = await response.json();
                setStatus("Failed: " + (res.message || "Error"), false, false);
                toggleButtons(false);
            }
        } catch (error) { 
            console.error(error); 
            setStatus("An error occurred!", false, false); 
            toggleButtons(false);
        }
    }

    // NEW: Get Both Links - Live & Clone
    function getDualLinks() {
        let repo = document.getElementById("fetchRepo").value.trim();
        if (!repo) { alert("Please enter the repository name!"); return; }
        
        let gitUrl = `https://github.com/${USERNAME}/${repo}.git`;
        let liveUrl = `https://${USERNAME}.github.io/${repo}/`;
        
        document.getElementById("dualGitUrl").value = gitUrl;
        document.getElementById("dualLiveUrl").value = liveUrl;
        document.getElementById("dualLinkBox").style.display = "block";
        
        setStatus("✅ Both links are ready!", true, false);
        
        // Also check if live page is active
        checkLivePageStatus(repo);
    }

    async function checkLivePageStatus(repo) {
        try {
            let response = await fetch(`https://api.github.com/repos/${USERNAME}/${repo}/pages`, {
                headers: { "Authorization": `token ${TOKEN}`, "Accept": "application/vnd.github.v3+json" }
            });
            
            let box = document.getElementById("liveLinkBox");
            if (response.ok) {
                let data = await response.json();
                let liveUrl = data.html_url || `https://${USERNAME}.github.io/${repo}/`;
                box.style.display = "block";
                box.innerHTML = `
                    <b>✅ Live Page is Active!</b><br>
                    <a href="${liveUrl}" target="_blank" style="color: #0d6efd; font-weight:bold; word-break: break-all;">${liveUrl} ↗</a>
                `;
            }
        } catch (e) {
            console.log("Live page check skipped");
        }
    }

    function copyDualGitUrl() {
        let input = document.getElementById("dualGitUrl");
        let btn = event.target;
        copyToClipboard(input.value, btn);
    }

    function copyDualLiveUrl() {
        let input = document.getElementById("dualLiveUrl");
        let btn = event.target;
        copyToClipboard(input.value, btn);
    }

    async function fetchRepoFiles() {
        let repo = document.getElementById("fetchRepo").value.trim();
        if (!repo) return;
        
        setStatus("Loading files...", false, true);
        let container = document.getElementById("fileListContainer");
        container.innerHTML = "Loading...";
        
        let apiUrl = `https://api.github.com/repos/${USERNAME}/${repo}/contents/`;
        try {
            let response = await fetch(apiUrl, { headers: { "Authorization": `token ${TOKEN}` } });
            if (!response.ok) {
                container.innerHTML = "Repository not found or empty.";
                setStatus("Load failed.", false, false);
                return;
            }
            let files = await response.json();
            container.innerHTML = "";

            files.forEach(file => {
                let itemDiv = document.createElement("div");
                itemDiv.className = "file-item";
                
                let infoDiv = document.createElement("div");
                infoDiv.className = "file-info";
                infoDiv.innerHTML = `<span>${file.name}</span>`;
                itemDiv.appendChild(infoDiv);

                let btnGroup = document.createElement("div");
                btnGroup.className = "btn-group";

                let editBtn = document.createElement("button");
                editBtn.className = "edit-btn";
                editBtn.innerText = "Edit";
                editBtn.onclick = function() {
                    editFile(repo, file.name);
                };
                btnGroup.appendChild(editBtn);

                itemDiv.appendChild(btnGroup);
                container.appendChild(itemDiv);
            });
            
            setStatus("Files loaded successfully!", true, false);
            // Auto get links when files load
            getDualLinks();
        } catch (error) { 
            console.error(error); 
            setStatus("An error occurred!", false, false); 
        }
    }

    window.onload = function() { setStatus("System is ready.", true, false); };
</script>

</body>
</html>
