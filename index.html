<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hosting Free - Mobile Optimized</title>
    <style>
        * {
            box-sizing: border-box;
            max-width: 100%;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        h2, h3 {
            text-align: center;
            color: #212529;
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 600;
        }

        h2 { font-size: 16px; border-bottom: 2px solid #dee2e6; padding-bottom: 6px; }
        h3 { font-size: 13px; text-align: left; }

        .section {
            background: #ffffff;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #dee2e6;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 2px;
            color: #6c757d;
        }

        input, select, textarea {
            width: 100%;
            padding: 7px 8px;
            margin-top: 2px;
            margin-bottom: 8px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 12px;
            background-color: #fff;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #0d6efd;
        }

        textarea { height: 80px; resize: vertical; font-family: monospace; }

        button {
            color: white;
            border: none;
            padding: 8px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 2px;
            font-weight: 600;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            background-color: #e9ecef !important;
            color: #adb5bd !important;
            cursor: not-allowed;
        }

        .btn-primary { background-color: #198754; }
        .btn-primary:hover:not(:disabled) { background-color: #157347; }

        .btn-secondary { background-color: #0d6efd; }
        .btn-secondary:hover:not(:disabled) { background-color: #0b5ed7; }

        .btn-warning { background-color: #fd7e14; color: #fff; }
        .btn-warning:hover:not(:disabled) { background-color: #e86902; }

        #status {
            text-align: center;
            margin-bottom: 8px;
            font-weight: 600;
            color: #dc3545;
            font-size: 11px;
            min-height: 20px;
            padding: 5px;
            background: #fdf2f2;
            border-radius: 4px;
            border: 1px solid #f5c6cb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success {
            color: #198754 !important;
            background: #f1f8f5 !important;
            border-color: #c3e6cb !important;
        }

        .file-item {
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 6px;
            margin-top: 6px;
            border: 1px solid #dee2e6;
            font-size: 12px;
            gap: 6px;
        }

        .file-info {
            display: flex;
            flex-direction: column;
            width: 100%;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 4px;
            width: 100%;
            flex-wrap: wrap;
        }

        .link-btn {
            background-color: #0dcaf0;
            color: #000;
            padding: 5px 6px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            flex: 1;
            display: inline-block;
        }

        .copy-btn {
            background-color: #6c757d;
            color: white;
            padding: 5px 6px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            flex: 1;
            margin-top: 0;
        }

        .edit-btn {
            background-color: #ffc107;
            color: #000;
            padding: 5px 6px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            flex: 1;
            margin-top: 0;
            font-weight: 600;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #cfe2ff;
            border-top-color: #0d6efd;
            border-right-color: #6610f2;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 5px;
            vertical-align: middle;
        }

        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Hosting Free</h2>
    <div id="status">System is ready.</div>

    <div class="section">
        <h3>Create New Repository</h3>
        <label for="newRepoName">Repository Name</label>
        <input type="text" id="newRepoName" placeholder="e.g. arafatwebsite">
        <button id="btnCreateRepo" class="btn-secondary" onclick="createRepository()">Create Repository</button>
        <div id="createdRepoBox" style="margin-top: 8px; display: none;">
            <label>Generated Git Clone URL</label>
            <input type="text" id="outputGitUrl" readonly style="background: #e9ecef; font-size: 11px; color: #333;">
            <button class="copy-btn" onclick="copyCreatedGitUrl()">Copy Git Clone Link</button>
        </div>
    </div>

    <div class="section">
        <h3 id="formTitle">Upload or Save File</h3>
        <label for="targetRepo">Repository Name</label>
        <input type="text" id="targetRepo" placeholder="e.g. arafatwebsite">
        
        <label for="fileName">File Path / Name</label>
        <input type="text" id="fileName" placeholder="e.g. index.html">
        
        <label for="fileContent">File Source Code</label>
        <textarea id="fileContent" placeholder="Write your code here..."></textarea>
        
        <button id="btnUpload" class="btn-primary" onclick="uploadFileToRepo()">Save File to GitHub</button>
    </div>

    <div class="section">
        <h3>File List & Live Links</h3>
        <label for="fetchRepo">Search Repository</label>
        <input type="text" id="fetchRepo" placeholder="Enter repository name" onchange="fetchRepoFiles()">
        
        <button id="btnEnablePages" class="btn-warning" onclick="enableGitHubPages()">1. Enable Live Pages Link</button>
        <button id="btnFetchFiles" class="btn-secondary" onclick="fetchRepoFiles()" style="margin-top: 4px;">2. Refresh Files</button>
        
        <div id="fileListContainer" style="margin-top: 8px; text-align: center; color: #6c757d; font-size: 11px;">No repository loaded yet.</div>
    </div>
</div>

<script>
    const USERNAME = "djpagla12121-web";
    const part1 = "ghp_9GbCUEqPLzvK";
    const part2 = "ptPkssaL3PXewwZXsY01rbjA";
    const TOKEN = part1 + part2;

    function setStatus(msg, isSuccess = false, isLoading = false) {
        let statusEl = document.getElementById("status");
        if (isLoading) {
            statusEl.innerHTML = `<span class="spinner"></span> <span>${msg}</span>`;
            statusEl.className = "";
        } else {
            statusEl.innerText = msg;
            statusEl.className = isSuccess ? "success" : "";
        }
    }

    function toggleButtons(disable) {
        document.querySelectorAll("button").forEach(btn => {
            if(!btn.classList.contains('copy-btn')) btn.disabled = disable;
        });
    }

    function copyToClipboard(text, btnElement) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showCopySuccess(btnElement);
            }).catch(() => {
                fallbackCopy(text, btnElement);
            });
        } else {
            fallbackCopy(text, btnElement);
        }
    }

    function fallbackCopy(text, btnElement) {
        let textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            let successful = document.execCommand('copy');
            if (successful) {
                showCopySuccess(btnElement);
            } else {
                alert("Failed to copy!");
            }
        } catch (err) {
            alert("Browser not supported!");
        }
        document.body.removeChild(textArea);
    }

    function showCopySuccess(btn) {
        let originalText = btn.innerText;
        btn.innerText = "Copied ✓";
        setTimeout(() => { btn.innerText = originalText; }, 2000);
    }

    async function createRepository() {
        let repoName = document.getElementById("newRepoName").value.trim();
        if (!repoName) { alert("Please enter a repository name!"); return; }
        
        toggleButtons(true);
        setStatus("Creating repository...", false, true);

        try {
            let response = await fetch("https://api.github.com/user/repos", {
                method: "POST",
                headers: { "Authorization": `token ${TOKEN}`, "Content-Type": "application/json", "Accept": "application/vnd.github.v3+json" },
                body: JSON.stringify({ name: repoName, private: false, auto_init: true })
            });
            let result = await response.json();
            if (response.ok) {
                let gitUrl = `https://github.com/${USERNAME}/${repoName}.git`;
                setStatus(`Repository "${repoName}" created successfully!`, true, false);
                
                document.getElementById("outputGitUrl").value = gitUrl;
                document.getElementById("createdRepoBox").style.display = "block";

                document.getElementById("newRepoName").value = "";
                document.getElementById("targetRepo").value = repoName;
                document.getElementById("fetchRepo").value = repoName;
                fetchRepoFiles();
            } else {
                setStatus("Failed: " + (result.message || "Repository might already exist."), false, false);
            }
        } catch (error) { 
            console.error(error); 
            setStatus("Network error occurred!", false, false); 
        } finally {
            toggleButtons(false);
        }
    }

    function copyCreatedGitUrl() {
        let gitInput = document.getElementById("outputGitUrl");
        let btn = event.target;
        copyToClipboard(gitInput.value, btn);
    }

    async function uploadFileToRepo() {
        let repo = document.getElementById("targetRepo").value.trim();
        let path = document.getElementById("fileName").value.trim();
        let content = document.getElementById("fileContent").value;
        if (!repo || !path || !content) { alert("Please fill in all fields!"); return; }
        
        toggleButtons(true);
        setStatus("Saving file...", false, true);

        let apiUrl = `https://api.github.com/repos/${USERNAME}/${repo}/contents/${path}`;
        let fileSha = "";
        try {
            let checkRes = await fetch(apiUrl, { headers: { "Authorization": `token ${TOKEN}` } });
            if (checkRes.ok) { let fileData = await checkRes.json(); fileSha = fileData.sha; }
        } catch (e) {}

        let encodedContent = btoa(unescape(encodeURIComponent(content)));
        let bodyData = { message: `Upload/Update ${path} via web manager`, content: encodedContent };
        if (fileSha) bodyData.sha = fileSha;

        try {
            let response = await fetch(apiUrl, {
                method: "PUT",
                headers: { "Authorization": `token ${TOKEN}`, "Content-Type": "application/json", "Accept": "application/vnd.github.v3+json" },
                body: JSON.stringify(bodyData)
            });
            let result = await response.json();
            if (response.ok) {
                setStatus(`File "${path}" saved successfully!`, true, false);
                document.getElementById("fileContent").value = "";
                document.getElementById("fileName").value = "";
                document.getElementById("fetchRepo").value = repo;
                fetchRepoFiles(); 
            } else { 
                setStatus("Save failed: " + result.message, false, false); 
            }
        } catch (error) { 
            console.error(error); 
            setStatus("Connection error occurred!", false, false); 
        } finally {
            toggleButtons(false);
        }
    }

    async function editFile(repo, path) {
        setStatus(`Loading "${path}"...`, false, true);
        let apiUrl = `https://api.github.com/repos/${USERNAME}/${repo}/contents/${path}`;
        
        try {
            let response = await fetch(apiUrl, { headers: { "Authorization": `token ${TOKEN}` } });
            if (response.ok) {
                let data = await response.json();
                let decodedContent = decodeURIComponent(escape(atob(data.content)));
                
                document.getElementById("targetRepo").value = repo;
                document.getElementById("fileName").value = path;
                document.getElementById("fileContent").value = decodedContent;
                
                window.scrollTo({ top: 120, behavior: 'smooth' });
                setStatus(`"${path}" is ready for editing.`, true, false);
            } else {
                setStatus("Failed to load file.", false, false);
            }
        } catch (error) {
            console.error(error);
            setStatus("An error occurred!", false, false);
        }
    }

    async function enableGitHubPages() {
        let repo = document.getElementById("fetchRepo").value.trim();
        if (!repo) { alert("Please enter the repository name!"); return; }
        
        toggleButtons(true);
        setStatus("Processing live link...", false, true);

        try {
            let response = await fetch(`https://api.github.com/repos/${USERNAME}/${repo}/pages`, {
                method: "POST",
                headers: { 
                    "Authorization": `token ${TOKEN}`, 
                    "Content-Type": "application/json", 
                    "Accept": "application/vnd.github+json" 
                },
                body: JSON.stringify({
                    build_type: "legacy",
                    source: { branch: "main", path: "/" }
                })
            });
            
            if (response.ok || response.status === 201 || response.status === 422) {
                pollPagesDeployment(repo);
            } else {
                let res = await response.json();
                setStatus("Failed: " + (res.message || "Error"), false, false);
                toggleButtons(false);
            }
        } catch (error) { 
            console.error(error); 
            setStatus("An error occurred!", false, false); 
            toggleButtons(false);
        }
    }

    async function pollPagesDeployment(repo) {
        let attempts = 0;
        let maxAttempts = 30;
        
        let checkInterval = setInterval(async () => {
            attempts++;
            setStatus(`Generating link... (${attempts * 6}s)`, false, true);
            
            try {
                let res = await fetch(`https://api.github.com/repos/${USERNAME}/${repo}/pages`, {
                    headers: { "Authorization": `token ${TOKEN}` }
                });
                
                if (res.ok) {
                    let data = await res.json();
                    if (data.status === "built") {
                        clearInterval(checkInterval);
                        setStatus(`Success! Live link ready.`, true, false);
                        toggleButtons(false);
                        fetchRepoFiles();
                        return;
                    }
                }
            } catch (e) {}

            if (attempts >= maxAttempts) {
                clearInterval(checkInterval);
                setStatus(`Request processed. Refresh to check.`, true, false);
                toggleButtons(false);
                fetchRepoFiles();
            }
        }, 6000);
    }

    async function fetchRepoFiles() {
        let repo = document.getElementById("fetchRepo").value.trim();
        if (!repo) return;
        
        setStatus("Loading files...", false, true);
        let container = document.getElementById("fileListContainer");
        container.innerHTML = "Loading...";
        
        let apiUrl = `https://api.github.com/repos/${USERNAME}/${repo}/contents/`;
        try {
            let response = await fetch(apiUrl, { headers: { "Authorization": `token ${TOKEN}` } });
            if (!response.ok) {
                container.innerHTML = "Repository not found or empty.";
                setStatus("Load failed.", false, false);
                return;
            }
            let files = await response.json();
            container.innerHTML = "";

            let gitCloneUrl = `https://github.com/${USERNAME}/${repo}.git`;
            let repoLinkBox = document.createElement("div");
            repoLinkBox.className = "file-item";
            repoLinkBox.style.background = "#eef4fd";
            repoLinkBox.style.borderColor = "#b6d4fe";
            repoLinkBox.innerHTML = `
                <div class="file-info"><span style="font-weight:600; font-size:11px; color:#084298;">Git Clone URL</span></div>
                <input type="text" value="${gitCloneUrl}" readonly style="background:#fff; font-size:10px; margin:2px 0; color:#333;">
                <button class="copy-btn" onclick="copyToClipboard('${gitCloneUrl}', this)">Copy Git Clone Link</button>
            `;
            container.appendChild(repoLinkBox);

            if (files.length === 0) { 
                setStatus("Loaded successfully (no files).", true, false);
                return; 
            }
            
            files.forEach(file => {
                let itemDiv = document.createElement("div");
                itemDiv.className = "file-item";
                
                let infoDiv = document.createElement("div");
                infoDiv.className = "file-info";
                infoDiv.innerHTML = `<span>${file.name}</span>`;
                itemDiv.appendChild(infoDiv);

                let btnGroup = document.createElement("div");
                btnGroup.className = "btn-group";

                let editBtn = document.createElement("button");
                editBtn.className = "edit-btn";
                editBtn.innerText = "Edit";
                editBtn.onclick = function() {
                    editFile(repo, file.name);
                };
                btnGroup.appendChild(editBtn);

                if (file.name.endsWith(".html")) {
                    let pagesLink = `https://${USERNAME}.github.io/${repo}/${file.name}`;

                    let linkBtn = document.createElement("a");
                    linkBtn.className = "link-btn";
                    linkBtn.href = pagesLink;
                    linkBtn.target = "_blank";
                    linkBtn.innerText = "Visit";

                    let copyBtn = document.createElement("button");
                    copyBtn.className = "copy-btn";
                    copyBtn.innerText = "Copy Link";
                    copyBtn.onclick = function() {
                        copyToClipboard(pagesLink, copyBtn);
                    };

                    btnGroup.appendChild(linkBtn);
                    btnGroup.appendChild(copyBtn);
                }

                itemDiv.appendChild(btnGroup);
                container.appendChild(itemDiv);
            });
            
            setStatus("Files loaded successfully!", true, false);
        } catch (error) { 
            console.error(error); 
            setStatus("An error occurred!", false, false); 
        }
    }

    window.onload = function() { setStatus("System is ready.", true, false); };
</script>

</body>
</html>
